# -------------------------------------------------
# OpenAI - Chat Model
# -------------------------------------------------
# A chave de API é lida da variável de ambiente OPENAI_API_KEY
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.timeout=60s

# -------------------------------------------------
# OpenAI - Embedding Model (para RAG)
# text-embedding-3-small: substituto moderno do ada-002
# Dimensão: 1536
# -------------------------------------------------
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small

# -------------------------------------------------
# Datasource PostgreSQL (usado pelo pgvector)
# -------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=pguser
quarkus.datasource.password=pgpassword
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ragdb

# -------------------------------------------------
# pgvector - Embedding Store
# -------------------------------------------------
# Dimensão deve corresponder ao modelo de embedding (text-embedding-3-small = 1536)
quarkus.langchain4j.pgvector.register-vector-pg-extension=true
quarkus.langchain4j.pgvector.dimension=1536
quarkus.langchain4j.pgvector.create-table=true
# cria a tabela travel_embeddings
quarkus.langchain4j.pgvector.table=travel_embeddings
# sempre vai matar a tabela
quarkus.langchain4j.pgvector.drop-table-first=true

# Loga a requisicao e a resposta completas trocadas com o LLM (incluindo o
# manifesto de Tools). Restrito ao perfil %dev pois expoe prompts e o header
# Authorization em texto puro nos logs -- nunca habilitar em producao.
# Requer tambem elevar a categoria de log correspondente para DEBUG, ja que
# o corpo e emitido nesse nivel pelo client HTTP interno do LangChain4j.
%dev.quarkus.langchain4j.openai.log-requests=true
%dev.quarkus.langchain4j.openai.log-responses=true
%dev.quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG
