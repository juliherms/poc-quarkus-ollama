services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: poc-pgvector
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
